services:
  adserv:
    build: .
    ports:
      - "8000:8000"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --reload
    env_file:
      - .env
    environment:
      - DB__HOST=db
      - DB__USER=${POSTGRES_USER}
      - DB__PASSWORD=${POSTGRES_PASSWORD}
      - DB__DB=${POSTGRES_DB}
      - ENV=docker
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - ./app:/app/app

  db:
    image: postgres:18
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
